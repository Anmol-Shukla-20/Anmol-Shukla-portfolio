<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anmol | Terminal Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="terminal">
  <div class="header">
    <span>CPU: 27% | RAM: 4.2/16GB | NET: CONNECTED</span>
  </div>

  <div id="output"></div>

  <div class="hero">
  <img src="assets/images/me.jpg" alt="Anmol Shukla" class="profile-pic">

  <h1>Hi, I’m Anmol 👋</h1>
  <p>Electrical Engineer | CS Specialization | Builder</p>
</div>

  <div class="input-line">
    <span class="prompt">anmol@portfolio:~$</span>
    <input type="text" id="command" autofocus />
  </div>

  <div class="buttons">
    <button onclick="runCommand('help')">help</button>
    <button onclick="runCommand('about')">about</button>
    <button onclick="runCommand('skills')">skills</button>
    <button onclick="runCommand('projects')">projects</button>
    <button onclick="runCommand('resume')">resume</button>
    <button onclick="runCommand('contact')">contact</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
